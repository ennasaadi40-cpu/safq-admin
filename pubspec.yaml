name: SafQ
description: Station Admin App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  google_fonts: ^6.1.0
  pdf: ^3.10.8
  printing: ^5.12.0
  http: ^1.2.0
  url_launcher: ^6.2.0
  path_provider: ^2.0.0
  open_file: ^3.3.0
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/fonts/Tajawal-Regular.ttf

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf